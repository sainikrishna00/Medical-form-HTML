<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medical Intake Form</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    margin: 0;
}

.container {
    max-width: 1000px;
    margin: 30px auto;
    background: #fff;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

.header {
    background: linear-gradient(to right, #3b82f6, #06b6d4);
    color: white;
    padding: 25px;
}

.header h1 {
    margin: 0;
}

.header p {
    margin-top: 8px;
    font-size: 14px;
}

.form-section {
    padding: 25px;
}

h2 {
    margin-top: 20px;
    margin-bottom: 15px;
}

.form-row {
    display: flex;
    gap: 20px;
    margin-bottom: 15px;
}

.form-group {
    flex: 1;
    display: flex;
    flex-direction: column;
}

label {
    font-weight: 600;
    margin-bottom: 5px;
}

input, select, textarea {
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 14px;
}

textarea {
    resize: vertical;
    min-height: 80px;
}

.radio-group {
    display: flex;
    gap: 15px;
    align-items: center;
}

button {
    margin-top: 20px;
    background: #2563eb;
    color: white;
    border: none;
    padding: 12px 25px;
    border-radius: 25px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

.hidden {
    display: none;
}

/* Responsive */
@media (max-width: 768px) {
    .form-row {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<div class="container">
    <div class="header">
        <h1>Medical Intake Form</h1>
        <p>Please complete the form with your details and current health information. Fields marked with * are required.</p>
    </div>

    <div class="form-section">
        <form id="medicalForm">

            <h2>Personal Information</h2>

            <div class="form-row">
                <div class="form-group">
                    <label>Full name *</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label>Age *</label>
                    <input type="number" id="age" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Gender *</label>
                    <select required>
                        <option value="">Select gender</option>
                        <option>Male</option>
                        <option>Female</option>
                        <option>Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Phone or Email *</label>
                    <input type="text" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Blood Type *</label>
                    <select required>
                        <option value="">Select blood type</option>
                        <option>A+</option>
                        <option>B+</option>
                        <option>O+</option>
                        <option>AB+</option>
                        <option>A-</option>
                        <option>B-</option>
                        <option>O-</option>
                        <option>AB-</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Height</label>
                    <input type="text" placeholder="e.g. 170 cm or 5'7">
                </div>
            </div>

            <div class="form-group">
                <label>Weight</label>
                <input type="text" placeholder="e.g. 70 kg or 154 lbs">
            </div>

            <h2>Current Health & History</h2>

            <div class="form-row">
                <div class="form-group">
                    <label>Current symptoms</label>
                    <textarea></textarea>
                </div>
                <div class="form-group">
                    <label>Medical history</label>
                    <textarea></textarea>
                </div>
            </div>

            <label>Do you have allergies?</label>
            <div class="radio-group">
                <label><input type="radio" name="allergy" value="yes"> Yes</label>
                <label><input type="radio" name="allergy" value="no"> No</label>
            </div>

            <div class="form-group hidden" id="allergyDetails">
                <label>Allergy details</label>
                <textarea placeholder="Explain allergies or intolerances"></textarea>
            </div>

            <h2>Medications & Lifestyle</h2>

            <div class="form-row">
                <div class="form-group">
                    <label>Current medications</label>
                    <textarea></textarea>
                </div>
                <div class="form-group">
                    <label>Lifestyle notes</label>
                    <textarea placeholder="e.g. smoking, exercise, diet"></textarea>
                </div>
            </div>

            <h2>Emergency Contact</h2>

            <div class="form-row">
                <div class="form-group">
                    <label>Contact name *</label>
                    <input type="text" required>
                </div>
                <div class="form-group">
                    <label>Contact phone *</label>
                    <input type="text" required>
                </div>
            </div>

            <div class="form-group">
                <label>Relationship</label>
                <input type="text">
            </div>

            <button type="submit">Submit Medical Form</button>

        </form>
    </div>
</div>

<script>
// Show/Hide Allergy Details
const allergyRadios = document.querySelectorAll('input[name="allergy"]');
const allergyBox = document.getElementById('allergyDetails');

allergyRadios.forEach(radio => {
    radio.addEventListener('change', () => {
        if (radio.value === 'yes') {
            allergyBox.classList.remove('hidden');
        } else {
            allergyBox.classList.add('hidden');
        }
    });
});

// Form Submit
document.getElementById('medicalForm').addEventListener('submit', function(e) {
    e.preventDefault();
    alert("Form submitted successfully!");
});
</script>

</body>
</html>
